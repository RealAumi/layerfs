[package]
name = "deepseek-sdk-experiment"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
layerfs-api = { path = "../../core/crates/layerfs-api" }
layerfs-bridge = { path = "../../core/crates/layerfs-bridge" }
layerfs-history = { path = "../../core/crates/layerfs-history" }
layerfs-persistence = { path = "../../core/crates/layerfs-persistence" }
layerfs-storage = { path = "../../core/crates/layerfs-storage" }
layerfs-sandbox = { path = "../../core/crates/layerfs-sandbox" }
layerfs-telemetry = { path = "../../core/crates/layerfs-telemetry" }

[[bin]]
name = "deepseek-sdk-checkpoint"
path = "src/checkpoint.rs"

[[bin]]
name = "deepseek-sdk-measure"
path = "src/measure.rs"
